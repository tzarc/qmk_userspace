[dependency-groups]
dev = [
  {include-group = "qmk-firmware"},
  "pip",
  "pre-commit",
  "ruff"
]
# Mirrors qmk_firmware's requirements.txt, requirements-dev.txt, util/ci/requirements.txt
qmk-firmware = [
  "ansi2html",
  "argcomplete",
  "colorama",
  "discord-webhook",
  "dotty-dict",
  "flake8",
  "hid",
  "hjson",
  "jinja2",
  "jsonschema>=4",
  "milc>=1.9.0",
  "nose2",
  "pep8-naming",
  "pillow",
  "pyflakes",
  "pygments",
  "pyserial",
  "pyusb",
  "yapf"
]

[project]
authors = [{name = "Nick Brassel", email = "nick@tzarc.org"}]
dependencies = [
  "bokeh>=2.0,<3.0",
  "compiledb",
  "fnvhash",
  "pyelftools",
  "qmk",
  "squarify>=0.4.3,<1.0",
  # Optional imports in qmk_firmware: `qmk generate-develop-pr-list`, parallel map in qmk/util.py
  "ghapi",
  "mpire",
  "python-sqlite-cache",
  # qmk_api / qmk_compiler, cloned by `make repositories`
  "redis",
  "rq"
]
description = "@tzarc's QMK Userspace."
name = "tzarc_qmk_userspace"
requires-python = ">=3.14"
version = "0.1"

[project.urls]
"Homepage" = "https://github.com/tzarc/qmk_userspace"

[tool.ruff]
# I like longer lines.
line-length = 160
# Targeting python 3.14+
target-version = "py314"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = []
# Pyflakes (`F`), a subset of pycodestyle (`E`), pyupgrade (`UP`), unused-noqa (`RUF100`).
select = ["E4", "E7", "E9", "F", "UP", "RUF100"]
unfixable = []

[tool.uv]
package = false
